<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Panier</title>
  <link rel="stylesheet" href="panier.css">
  <link rel="icon" href="dress-up-logo.png" type="image/png">
</head>
<body>

    <!--Header-->
    <header>
        <img class="logo" src="dress-up-logo.png" alt="">
    </header>

    <!-- MENU NAVIGATION -->
    <nav>
        <ul>
            <li><a href="accueil.html">Accueil</a></li>&ensp;
            <li><a href="contact.html">Contact</a></li>&ensp;
            <li><a href="Panier.html">Panier</a></li>&ensp;
            <li><a href="log.html">Déconnexion</a></li>
        </ul>
    </nav>

    <fieldset>
        <legend><h1><i>Votre panier</i></h1></legend>
    <div class="container">
        <h1>Finaliser votre commande</h1>
        <div class="summary">
            <h3>Résumé de la commande</h3>
            <p>Article : Livre "Exemple" - Quantité : 1 - Total : 15 €</p>
        </div>
        
        <form action="#" method="post">
            <h3>Méthode de paiement</h3>
            <div class="radio-group">
                <label><input type="radio" name="payment" value="card" checked> Carte de crédit/débit</label>
                <label><input type="radio" name="payment" value="paypal"> PayPal</label>
                <label><input type="radio" name="payment" value="bank"> Virement bancaire</label>
            </div>
            
            <label>Numéro de carte (si carte) : <input type="text" placeholder="1234 5678 9012 3456"></label>
            <label>Date d'expiration : <input type="month"></label>
            <label>CVV : <input type="text" placeholder="123"></label>
            
            <button type="submit">Confirmer la commande</button>
        </form>
    </div>

</fieldset>

</body>
</html>
